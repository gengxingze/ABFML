# ======================================================
#  ABFML Documentation Configuration
#  Powered by MkDocs + Material
# ======================================================

site_name: ABFML
site_description: "A machine learning force field framework based on PyTorch"
site_author: "ABFML Developers"
site_url: https://gengxingze.github.io/ABFML/

repo_url: https://github.com/gengxingze/ABFML
repo_name: gengxingze/ABFML
edit_uri: ""  # 可选：可留空以隐藏“Edit on GitHub”链接

# ------------------------------------------------------
#  Theme Configuration
# ------------------------------------------------------
theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.png

  features:
    - navigation.tabs
    - navigation.expand
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.integrate
    - search.suggest
    - search.highlight
    - header.autohide
    - announce.dismiss

  palette:
    # 亮色模式
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # 暗色模式
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: "Times New Roman"
    code: "Fira Code"

# ------------------------------------------------------
#  Navigation
# ------------------------------------------------------
nav:
  - Home: index.md
  - Tutorial:
      - Overview: tutorials/index.md
      - Train model:
        - MgCu: tutorials/mgcu.md
        - Fcc-Au: tutorials/fcc_au.md
        - Custom Model: tutorials/custom_model.md
      - Results Analysis: tutorials/result_analysis.md
      - Running Simulations: tutorials/simulation.md
      - Utilities and Tools: tutorials/tools.md

  - Document:
      - Installation: install.md
      - Command-line Interface: cli.md
      - FAQ: faq.md
  - API Reference:
      - Methods: api/method.md
      - Utils: api/utils.md
  - Citation: citation.md

# ------------------------------------------------------
#  Plugins
# ------------------------------------------------------
plugins:
  - search:
      lang: zh
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            heading_level: 2
            inherited_members: true
            merge_init_into_class: true

# ------------------------------------------------------
#  Markdown Extensions
# ------------------------------------------------------
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

# ------------------------------------------------------
#  Extra Features
# ------------------------------------------------------
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gengxingze/ABFML
      name: View on GitHub
  generator: True
  analytics:  # 可选：放 Google Analytics ID
    provider: google
    property: G-XXXXXXXXXX
  copyright: >
    © 2025 <strong>ABFML Developers</strong>. All rights reserved.

# ------------------------------------------------------
#  Custom CSS/JS (Optional)
# ------------------------------------------------------
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js
