[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "abfml"
version = "2026.11.19"
description = "A PyTorch framework for problem-oriented development, evaluation, and application of machine-learning force fields."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "GengXingZe", email = "1308186024@qq.com" },
]
keywords = [
    "machine learning force fields",
    "interatomic potentials",
    "custom models",
    "atomistic simulation",
    "molecular dynamics",
    "PyTorch",
    "ASE",
    "LAMMPS",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "ase>=3.22",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Python-side build dependency; CMake, MPI, and LAMMPS are supplied separately.
lammps = ["pybind11>=2.13"]

[project.urls]
Homepage = "https://github.com/gengxingze/ABFML"
Documentation = "https://gengxingze.github.io/ABFML/"
Repository = "https://github.com/gengxingze/ABFML"
Issues = "https://github.com/gengxingze/ABFML/issues"
Publication = "https://doi.org/10.1063/5.0247559"

[project.scripts]
abfml = "abfml.cli:main"

# Distribute Python packages only; keep documentation, tests, examples, and results in the repository.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["abfml", "abfml.*"]
namespaces = false
